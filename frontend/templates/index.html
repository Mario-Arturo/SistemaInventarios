{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Inventarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                Sistema de Inventarios
            </span>
        </div>
    </nav>

    <main class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1>Inventario de productos</h1>
                <p class="text-muted">
                    Consulta y administra los productos registrados.
                </p>
            </div>

            <button class="btn btn-primary" id="btn-nuevo-producto">
                + Nuevo producto
            </button>
        </div>

        <div class="row mb-3">

            <div class="col-md-8">
                <input
                    type="text"
                    class="form-control"
                    placeholder="Buscar producto..."
                >
            </div>

            <div class="col-md-4">
                <select class="form-select" id="filtro-categoria">
                    <option value="">Todas las categorías</option>
                    <option value="Electrónica">Electrónica</option>
                    <option value="Oficina">Oficina</option>
                    <option value="Muebles">Muebles</option>
                </select>
            </div>

        </div>

        <!-- Formulario para crear producto -->
        <div id="formulario-producto" class="card mb-4 d-none">
            <div class="card-body">

                <h4 class="card-title mb-3">Nuevo producto</h4>

                <form id="form-producto">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre</label>
                            <input
                                type="text"
                                id="nombre"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Categoría</label>
                            <select id="categoria" class="form-select" required>
                                <option value="">Selecciona una categoría</option>
                                <option value="Electrónica">Electrónica</option>
                                <option value="Oficina">Oficina</option>
                                <option value="Muebles">Muebles</option>
                            </select>
                        </div>

                        <div class="col-md-12 mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea
                                id="descripcion"
                                class="form-control"
                            ></textarea>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Precio</label>
                            <input
                                type="number"
                                id="precio"
                                class="form-control"
                                step="0.01"
                                min="0"
                                required
                            >
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Cantidad</label>
                            <input
                                type="number"
                                id="cantidad"
                                class="form-control"
                                min="0"
                                required
                            >
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Nivel mínimo</label>
                            <input
                                type="number"
                                id="nivel_minimo"
                                class="form-control"
                                min="0"
                                required
                            >
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Proveedor</label>
                            <input
                                type="text"
                                id="proveedor"
                                class="form-control"
                                required
                            >
                        </div>

                    </div>

                    <button type="submit" class="btn btn-success">
                        Guardar producto
                    </button>

                    <button
                        type="button"
                        id="btn-cancelar"
                        class="btn btn-secondary"
                    >
                        Cancelar
                    </button>

                </form>

            </div>
        </div>

        <!-- Tabla de productos -->
        <div class="card">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Proveedor</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="tabla-productos">
                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

    <script src="{% static 'js/app.js' %}"></script>

</body>
</html>
